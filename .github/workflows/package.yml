name: Package

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths-ignore: ["*.md"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      # Must run before make: the Makefile includes
      # node_modules/@start9labs/start-sdk/s9pk.mk, so make cannot even parse
      # the Makefile until node dependencies are installed.
      - name: Install node dependencies
        run: npm ci

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make buildah fuse-overlayfs slirp4netns uidmap squashfs-tools squashfs-tools-ng jq

      - name: Configure Docker Buildx
        run: |
          docker buildx create --name hermes-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Configure container registries
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf.d/99-dockerio.conf

      - name: Install Start CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          url="$(curl -fsSL 'https://api.github.com/repos/Start9Labs/start-technologies/releases?per_page=20' | jq -r '[.[] | select(.tag_name | startswith("start-cli/")) | .assets[] | select(.name == "start-cli_x86_64-linux") | .browser_download_url][0] // empty')"
          if [ -z "$url" ]; then
            echo "Unable to find start-cli_x86_64-linux in Start9Labs/start-technologies start-cli releases" >&2
            exit 1
          fi
          curl -fsSL "$url" -o "$HOME/.local/bin/start-cli"
          chmod +x "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # StartOS 0.4.0 s9pks are signed, and a service only accepts updates
      # signed consistently with what it trusts. Use the persistent DEV_KEY
      # repo secret (ed25519 private key PEM) so every release is signed by
      # the SAME key — the official Start9 packaging workflows do exactly
      # this (secrets.DEV_KEY -> ~/.startos/id.key.pem). Without the secret,
      # fall back to a throwaway key with a loud warning: those builds work
      # for a fresh install but break the update chain.
      - name: Initialize StartOS developer key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s' "$DEV_KEY" > ~/.startos/id.key.pem
            chmod 600 ~/.startos/id.key.pem
            echo "Using persistent DEV_KEY for signing."
          else
            echo "::warning::No DEV_KEY secret set — signing with a throwaway key. Updates signed by different keys may be rejected by StartOS. Add an ed25519 private key PEM as the DEV_KEY repo secret."
            start-cli init-key
          fi
          # Print the PUBLIC key fingerprint (never the private key) so the
          # signing identity is observable across runs: a stable fingerprint
          # is the proof that consecutive releases share one signing key,
          # which is what makes StartOS accept them as updates of each other.
          if openssl pkey -in ~/.startos/id.key.pem -pubout -outform DER >/tmp/pub.der 2>/dev/null; then
            echo "Signing key public fingerprint (sha256): $(openssl dgst -sha256 /tmp/pub.der | awk '{print $2}')"
            rm -f /tmp/pub.der
          else
            echo "::warning::Could not read ~/.startos/id.key.pem as a PEM private key — check the DEV_KEY secret contains a full BEGIN/END PRIVATE KEY block."
          fi

      - name: Initialize StartOS packaging workspace
        run: |
          start-cli s9pk init-workspace ..
          # Keep the workspace build key identical to the identity key so the
          # pack signature is stable across runs (mirrors the official
          # Start9 build workflow).
          if [ -f ~/.startos/id.key.pem ]; then
            mkdir -p ../.startos .startos 2>/dev/null || true
            for d in ../.startos .startos; do
              [ -d "$d" ] && cp ~/.startos/id.key.pem "$d/build.key.pem" 2>/dev/null || true
            done
          fi

      # The Hermes Buzz platform adapter shells out to the `buzz` CLI for all
      # outbound messages; the upstream image does not ship it. Build it from
      # block/buzz (pinned commit for reproducibility) and package it as a
      # static asset the daemon mounts read-only at /opt/package-assets.
      # x86_64-only, matching the arch this workflow packs.
      - name: Build buzz CLI asset
        env:
          BUZZ_REPO: https://github.com/block/buzz.git
          BUZZ_REV: 8342dfcc5890b81a269a8ec3db73a8a56f76ce79
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$BUZZ_REPO" /tmp/buzz-src
          git -C /tmp/buzz-src checkout "$BUZZ_REV"
          cargo build --release -p buzz-cli --manifest-path /tmp/buzz-src/Cargo.toml
          bin="$(find /tmp/buzz-src/target/release -maxdepth 1 -type f -executable -name 'buzz*' ! -name '*.d' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "::error::buzz CLI binary not found after cargo build"
            exit 1
          fi
          install -m 0755 "$bin" assets/buzz
          echo "$BUZZ_REV" > assets/buzz.rev
          ./assets/buzz --version 2>/dev/null || ./assets/buzz --help >/dev/null 2>&1 || true
          echo "Packaged $(basename "$bin") ($(du -h assets/buzz | cut -f1)) from block/buzz@$BUZZ_REV"

      - name: Verify bundled Hermes runtime fixes
        working-directory: upstream-project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle_src = Path('cron/lifecycle_guard.py').read_text()
          required = [
              'def _expand_candidate_path(candidate: str)',
              'if not candidate or "\\x00" in candidate:',
              'except (ValueError, RuntimeError, OSError):',
              'path = _expand_candidate_path(candidate)',
          ]
          for needle in required:
              if needle not in lifecycle_src:
                  raise SystemExit(f'lifecycle NUL path guard missing: {needle}')
          print('Hermes lifecycle NUL path guard verified')
          PY

      - name: Verify bundled Codex OAuth fixes
        working-directory: upstream-project
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          models_src = Path('hermes_cli/codex_models.py').read_text()
          models_mod = ast.parse(models_src)
          defaults = None
          forward = None
          for node in models_mod.body:
              if isinstance(node, ast.AnnAssign) and getattr(node.target, 'id', None) == 'DEFAULT_CODEX_MODELS':
                  defaults = ast.literal_eval(node.value)
              if isinstance(node, ast.AnnAssign) and getattr(node.target, 'id', None) == '_FORWARD_COMPAT_TEMPLATE_MODELS':
                  forward = ast.literal_eval(node.value)
          if defaults is None:
              raise SystemExit('DEFAULT_CODEX_MODELS not found')
          if forward is None:
              raise SystemExit('_FORWARD_COMPAT_TEMPLATE_MODELS not found')
          for dead in ('gpt-5.2-codex', 'gpt-5.1-codex-max', 'gpt-5.1-codex-mini'):
              if dead in defaults:
                  raise SystemExit(f'dead Codex model still present: {dead}')
          if 'gpt-5.3-codex-spark' not in defaults:
              raise SystemExit('gpt-5.3-codex-spark missing from defaults')
          required_forward = [
              ('gpt-5.4-mini', ('gpt-5.3-codex',)),
              ('gpt-5.4', ('gpt-5.3-codex',)),
              ('gpt-5.3-codex-spark', ('gpt-5.3-codex',)),
          ]
          forward_set = set(forward)
          for entry in required_forward:
              if entry not in forward_set:
                  raise SystemExit(f'Required forward-compat entry missing: {entry!r}')
          runtime_src = Path('agent/codex_runtime.py').read_text()
          required = [
              'backend can return ``null``, ``[]``, a string, or omit the field entirely',
              'response.output_item.done',
              'def run_codex_create_stream_fallback(agent, api_kwargs: dict, client: Any = None):',
              'return run_codex_stream(agent, api_kwargs, client=client)',
          ]
          for needle in required:
              if needle not in runtime_src:
                  raise SystemExit(f'Codex stream guard missing: {needle}')
          print('Codex OAuth/model and stream guards verified')
          PY

      - name: Build package
        run: make x86_64

      - name: Upload .s9pk artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hermes-agent-startos_x86_64
          path: hermes-agent-startos_x86_64.s9pk

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          upstream_sha=$(git -C upstream-project rev-parse HEAD)
          # actions/checkout doesn't fetch tags for submodules, so fetch them
          # before describing or the release notes say "untagged".
          git -C upstream-project fetch --tags --force --depth=1 origin 2>/dev/null || true
          upstream_tag=$(git -C upstream-project describe --tags --exact-match 2>/dev/null || echo "untagged")
          notes=$(cat <<EOF
          ## Hermes Agent ${version} for StartOS

          Package version ${version} tracks upstream [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent) tag ${upstream_tag} at \`${upstream_sha}\`.

          ### Highlights
          - Tracks upstream Hermes v0.20.4 / v2026.8.18, a patch release
            rolling up the post-v0.20.2 stability window for downstream
            Docker/package consumers.
          - Upstream includes desktop glass/translucency work, tabbed
            Sessions/Bots surfaces, Bot Mode group-chat fixes, SkillEvaluator
            advisory scanning, cron media-send hardening, SessionDB contention
            fixes, parked-branch update honesty, and kanban native OS
            notification improvements.
          - Upstream now includes the terminal lifecycle guard NUL-path fix,
            so this wrapper verifies the bundled fix instead of applying a
            local patch during CI.
          - **Buzz platform enabled end to end:** the buzz CLI ships as a
            packaged asset (built from block/buzz) and the adapter finds it
            via BUZZ_CLI_PATH; stale canary cli_path entries are healed;
            LAN relay hostname pinning and private-CA trust restored; Buzz
            auto-enables when relay credentials exist in .env
          - **Fix:** "Set OpenAI OAuth Credentials" now merges into
            auth.json instead of overwriting it (previously destroyed other
            provider credentials, including the Nous session)
          - Daemon env pins PYTHONUNBUFFERED and the image PATH (immediate
            logs; correct subprocess command resolution)
          - Preserves the existing StartOS wrapper runtime: start-sdk 2.0.9,
            inline boot script, Buzz CLI asset mount, dashboard auth bootstrap,
            writable `/opt/data`, and immutable `/opt/hermes` install tree.
          - **Data preserved:** no data-layout changes — install as an update
            over your existing service (do NOT uninstall first; uninstalling
            deletes service data). Taking a backup first is recommended.

          ### Sideloading
          Download \`hermes-agent-startos_x86_64.s9pk\` and sideload via your Start9 server UI under **System > Sideload Service**.
          EOF
          )
          gh release delete "$tag" --yes 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" \
            --title "${tag} — Hermes Agent v${version}" \
            --notes "$notes" \
            --latest \
            hermes-agent-startos_x86_64.s9pk

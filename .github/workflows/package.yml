name: Package

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths-ignore: ["*.md"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make buildah fuse-overlayfs slirp4netns uidmap squashfs-tools squashfs-tools-ng jq

      - name: Configure Docker Buildx
        run: |
          docker buildx create --name hermes-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Configure container registries
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf.d/99-dockerio.conf

      - name: Install Start CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          url="$(curl -fsSL https://api.github.com/repos/Start9Labs/start-os/releases/latest | jq -r '.assets[] | select(.name == "start-cli_x86_64-linux") | .browser_download_url' | head -n 1)"
          curl -fsSL "$url" -o "$HOME/.local/bin/start-cli"
          chmod +x "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize StartOS developer key
        run: start-cli init-key

      - name: Verify bundled Codex OAuth fixes
        working-directory: upstream-project
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          models_src = Path('hermes_cli/codex_models.py').read_text()
          models_mod = ast.parse(models_src)
          defaults = None
          for node in models_mod.body:
              if isinstance(node, ast.AnnAssign) and getattr(node.target, 'id', None) == 'DEFAULT_CODEX_MODELS':
                  defaults = ast.literal_eval(node.value)
                  break
          if defaults is None:
              raise SystemExit('DEFAULT_CODEX_MODELS not found')
          for dead in ('gpt-5.2-codex', 'gpt-5.1-codex-max', 'gpt-5.1-codex-mini'):
              if dead in defaults:
                  raise SystemExit(f'dead Codex model still present: {dead}')
          runtime_src = Path('agent/codex_runtime.py').read_text()
          required = [
              'event_stream = active_client.responses.create(**stream_kwargs)',
              'def _consume_codex_event_stream',
              'def run_codex_create_stream_fallback',
          ]
          for needle in required:
              if needle not in runtime_src:
                  raise SystemExit(f'Codex stream guard missing: {needle}')
          print('Codex OAuth/model and stream guards verified')
          PY

      - name: Build package
        run: make x86_64

      - name: Upload .s9pk artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hermes-agent-startos_x86_64
          path: hermes-agent-startos_x86_64.s9pk
